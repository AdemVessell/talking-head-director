  - {kit: flutter, at: 0.14, db: -24}
  - {kit: tick, at: "A.w:5-0.04", db: -19}
  - {kit: sub, at: "A.w:5-0.02", db: -15}
  - {kit: swish, at: "A.w:lasted-0.03", db: -17}
  - {kit: tick, at: "A.w:5#2-0.04", db: -18}
  - {kit: lfe, at: "A.w:5#2-0.02", db: -12}
  - {kit: pencil, at: "T3.w:really", db: -25}
  - {kit: paper_slap, at: "T3.w:3D", db: -21}
  - {kit: paper_slap, at: "T3.w:animation", db: -21}
  - {kit: paper_slap, at: "T3.w:things", db: -21}
  - {kit: whoosh, at: "D.pin+0.12", db: -16}
  - {kit: printer, at: "D.pin+0.03", dur: 0.30, db: -22, align: start}
  - {kit: paper_slap, at: "D.pin+0.36", db: -19}
  - {kit: tape, at: "D.pin+0.37", db: -25}
  - {kit: tick, at: "D.w:$40-0.04", db: -18}
  - {kit: sub, at: "D.w:$40-0.02", db: -13}
  - {kit: tick, at: "E.w:14-0.05", db: -18}
  - {kit: lfe_big, at: "E.w:14-0.03", db: -11}
  - {kit: swish_short, at: "F.w:fast-0.10", db: -15}
  - {kit: shutter, at: "H.pout", db: -17}
  - {kit: stamp, at: "H.pout+0.14", db: -8}
  - {kit: stamp, at: "H.pout+0.34", db: -8, pitch: -1.5}
  - {kit: burn, at: "END-0.20", db: -24}
