# RØDE Rycote shotgun mic holder: a first-hand handling-noise test, evidence-board treatment.
# Story (cut across the recording): problem -> product claim -> "let's do a test" -> taps in the
# holder -> mic off -> taps by hand -> measured comparison -> his verdict -> stamp.
name: rode-holder-test
work_dir: ~/Movies/thd-work/rode-holder-test
source: "/Users/stevenson/Desktop/RØDE Rycote Shotgun Mic Holder YES! #shorts #microphones  @sennheiser #sennheiser #rode @rodemic.mp4"
flip: false
fps: 23.976
tail: 1.2
room_tone: [52.53, 54.53]
segments:
  # "If" runs straight on from "microphone" in the source: in point at the last dip before it
  - {id: A, in: 23.865, out: 25.865, air: 2, fill: post, text: "If you know anything about microphones, you know that"}
  # the "there" stutter is cut; the punch-in on "there's" hides the jump
  - {id: A2, in: 26.075, out: 28.53, air: 3, fill: pre, text: "there's noise associated with handling a mic."}
  - {id: B, in: 13.975, out: 18.50, air: 1, fill: post, text: "the Rode shotgun mic holder is so great. It's phenomenal.",
     display: "the RØDE shotgun mic holder is so great. It's phenomenal."}
  - {id: C, in: 28.535, out: 29.41, air: 3, fill: pre, text: "Now let's do a test."}
  - {id: D, in: 32.09, out: 36.30, air: 4, fill: post, text: "First let me just give a little tap here."}   # + 9 light taps in the holder
  - {id: E, in: 38.24, out: 40.78, air: 3, fill: post, text: "You can probably hear that, but now let's take the mic off."}
  - {id: F, in: 42.32, out: 45.40, air: 4, fill: post, text: "So now I'm just hand holding the Sennheiser MKH416."}
  - {id: G, in: 47.56, out: 49.84, air: 4, fill: post, text: ""}   # 8 light taps, hand-held: the evidence, no words
  - {id: H, in: 54.80, out: 57.55, air: 0, fill: post, text: "To me it works so perfectly you can literally hold the mic."}

films:
  closeup: {video: self, from: 2.05, to: 5.25}   # his own close-up of the holder

receipts:
  t1:
    lines: ["c:HANDLING TEST No.1", rule, "l:MIC: MKH416", "l:IN THE RØDE HOLDER", rule, "l:9 LIGHT TAPS", rule,
            "l:LOW-END THUMP", "l:PER TAP (MEDIAN)", "D:c:BASELINE", rule2,
            "l:MEASURED FROM THIS", "l:VIDEO'S AUDIO. ONE", "l:TAKE, NOT A LAB."]
    appear: "C.in"
    drop: ["C.in", "C.in+0.32", 900]
    tape_at: "C.in+0.32"
    values: {5: "D.in+1.72", 9: "E.w:hear-0.02"}
    stamps: [{text: TESTED, at: "H.pout+0.18", line: 3, angle: -6, width: 340}]
  t2:
    lines: ["c:HANDLING TEST No.2", rule, "l:MIC: MKH416", "l:HELD BY HAND", rule, "l:8 LIGHT TAPS", rule,
            "l:LOW-END THUMP", "l:PER TAP (MEDIAN)", "D:c:~+3.5 dB", rule2,
            "l:MEASURED FROM THIS", "l:VIDEO'S AUDIO. ONE", "l:TAKE, NOT A LAB."]
    appear: "G.pin"
    values: {5: "G.in+0.06", 9: "H.w:perfectly-0.02"}
labels:
  kicker: {text: HANDLING-NOISE TEST}
  product: {text: RØDE RYCOTE SHOTGUN MIC HOLDER}
  mic: {text: MKH416 · MY FAVORITE MIC}

layouts:
  hook:      # big print of the medium shot: face, mic, holder and hands
    board: [500, 600]
    light: [140, 180, 1000, 0.55, 1.20]
    presenter: &bigprint {center: [540, 940], inner: [840, 1260], rot: -1.2, face_frac: 0.38, eye: 0.28, res: 1.6, border: 20,
                tapes: [[-1, 0, -38], [1, 1, 36]],
                grade: {relight: 0.0, bg_dim: 0.0, wb: [0, 0, 0], contrast: 0.12, sat: 1.0, sharpen: 0.25}}
    labels: [{label: kicker, center: [350, 262], rot: -2.5, scale: 0.8}]
  face:      # the same print for close shots, without the kicker
    board: [500, 600]
    light: [140, 180, 1000, 0.55, 1.20]
    presenter: *bigprint
  product:   # his close-up of the holder, pinned with a typed label
    board: [1200, 500]
    light: [200, 220, 1000, 0.55, 1.20]
    films: [{film: closeup, window: [2.05, 5.25], appear: "B.pin", slap: false, center: [540, 840], inner: [860, 1075],
             rot: 1.4, res: 1.3, border: 18, focus: [0.5, 0.45], tapes: [[-1, 2, -36], [1, 3, 40]]}]
    labels: [{label: product, center: [520, 228], rot: -2.0, scale: 0.56}]
  test:      # the test bench: him small on the left, receipts pinned on the right
    board: [700, 900]
    light: [300, 260, 1000, 0.55, 1.20]
    presenter: {center: [335, 760], inner: [560, 840], rot: -1.8, face_frac: 0.38, eye: 0.28, res: 1.9, border: 18,
                tapes: [[-1, 2, -36], [1, 3, 40]],
                grade: {relight: 0.0, bg_dim: 0.0, wb: [0, 0, 0], contrast: 0.12, sat: 1.0, sharpen: 0.25}}
    receipts:
      t1: {left: 660, top: 300, width: 380, rot: 0.6, tape: true, tape_index: 1, tape_angle: 3}
      t2: {left: 1085, top: 300, width: 380, rot: -0.5, tape: true, tape_index: 3, tape_angle: -4}
  compare:   # the two receipts alone, same scale, same baselines
    board: [700, 900]
    light: [800, 300, 1000, 0.55, 1.20]
    receipts:
      t1: {left: 660, top: 300, width: 380, rot: 0.6, tape: true, tape_index: 1, tape_angle: 3}
      t2: {left: 1085, top: 300, width: 380, rot: -0.5, tape: true, tape_index: 3, tape_angle: -4}
  test2:     # second test: the hand-held receipt takes the spot beside him
    board: [900, 1300]
    light: [300, 260, 1000, 0.55, 1.20]
    presenter: {center: [335, 760], inner: [560, 840], rot: 1.4, face_frac: 0.38, eye: 0.28, res: 1.9, border: 18,
                tapes: [[-1, 1, -36], [1, 0, 40]],
                grade: {relight: 0.0, bg_dim: 0.0, wb: [0, 0, 0], contrast: 0.12, sat: 1.0, sharpen: 0.25}}
    receipts:
      t2: {left: 660, top: 300, width: 380, rot: -0.6, tape: true, tape_index: 3, tape_angle: -4}
  mic:       # mic off: a fresh print, labelled
    board: [1500, 700]
    light: [160, 200, 1000, 0.55, 1.20]
    presenter: {center: [540, 880], inner: [800, 1200], rot: 1.0, face_frac: 0.38, eye: 0.28, res: 1.5, border: 20,
                tapes: [[-1, 1, -40], [1, 0, 37]],
                grade: {relight: 0.0, bg_dim: 0.0, wb: [0, 0, 0], contrast: 0.12, sat: 1.0, sharpen: 0.25}}
    labels: [{label: mic, center: [640, 1300], rot: 2.5, scale: 0.6, appear: "F.w:Sennheiser-2f"}]

beats:
  - {name: hook, layout: hook, from: 0, to: "A.w:microphones-2f",
     camera: [[0, {center: [540, 960], zoom: 1.0}], ["A.w:microphones-2f", {center: [540, 952], zoom: 1.02}, io2]]}
  - {name: hook-punch, layout: hook, from: "A.w:microphones-2f", to: "A.pout",   # punch in on "microphones"
     camera: [["A.w:microphones-2f", {center: [540, 900], zoom: 1.17}], ["A.pout", {center: [540, 896], zoom: 1.2}, io2]]}
  - {name: noise, layout: hook, from: "A.pout", to: "A2.pout",      # punch into the hands and holder
     camera: [["A.pout", {center: [540, 1150], zoom: 1.55}], ["A2.pout", {center: [540, 1160], zoom: 1.62}, io2]]}
  - {name: product, layout: product, from: "A2.pout", to: "B.w:It's-2f",
     camera: [["A2.pout", {center: [540, 820], zoom: 1.0}], ["B.w:It's-2f", {center: [540, 805], zoom: 1.07}, io2]]}
  - {name: phenomenal, layout: face, from: "B.w:It's-2f", to: "B.pout",
     camera: [["B.w:It's-2f", {face: 0.40}], ["B.pout", {face: 0.40, zoom_mul: 1.03}, io2]]}
  - {name: bench, layout: test, from: "C.pin", to: "C.pout",
     camera: [["C.pin", {fit: [presenter, t1], band: [0.14, 0.70]}], ["C.pout", {fit: [presenter, t1], band: [0.14, 0.70], zoom_mul: 1.03}, io2]]}
  - {name: taps-holder, layout: test, from: "D.pin", to: "D.pout",
     camera: [["D.pin", {fit: [presenter, t1], band: [0.12, 0.70]}], ["D.w:here.", {fit: [presenter, t1], band: [0.12, 0.70], zoom_mul: 1.02}, io2],
              ["D.w:here.+0.30", {center: [300, 930], zoom: 1.55}, io3], ["D.pout", {center: [300, 938], zoom: 1.6}, io2]]}
  - {name: mic-off, layout: test, from: "E.pin", to: "E.pout",
     camera: [["E.pin", {fit: [presenter, t1], band: [0.12, 0.70]}], ["E.pout", {fit: [presenter, t1], band: [0.12, 0.70], zoom_mul: 1.04, dx: -20}, io2]]}
  - {name: hand-held, layout: mic, from: "F.pin", to: "F.pout",
     camera: [["F.pin", {fit: [presenter], band: [0.08, 0.72]}], ["F.pout", {fit: [presenter], band: [0.08, 0.72], zoom_mul: 1.05}, io2]]}
  - {name: taps-hand, layout: test2, from: "G.pin", to: "G.pout",
     camera: [["G.pin", {center: [300, 930], zoom: 1.5}], ["G.pout", {center: [300, 940], zoom: 1.58}, io2]]}
  - {name: comparison, layout: compare, from: "H.pin", to: "H.w:you-2f",
     camera: [["H.pin", {fit: [t1, t2], band: [0.16, 0.68]}], ["H.w:you-2f", {fit: [t1, t2], band: [0.16, 0.68], zoom_mul: 1.03}, io2]]}
  - {name: verdict, layout: face, from: "H.w:you-2f", to: "H.pout",  # snap in on "literally"
     camera: [["H.w:you-2f", {face: 0.34}], ["H.w:literally-0.10", {face: 0.34, zoom_mul: 1.02}, io2],
              ["H.w:literally+0.12", {face: 0.46}, oexp], ["H.pout", {face: 0.46, zoom_mul: 1.03}, io2]]}
  - {name: callback, layout: compare, from: "H.pout", to: END,
     camera: [["H.pout", {fit: [t1, t2], band: [0.16, 0.68]}], [END, {fit: [t1, t2], band: [0.16, 0.68], zoom_mul: 1.03}, io2]]}

captions:
  y: 1440
  groups: [[0, 2], [3, 4], [5, 5], [6, 8], [9, 10], [11, 12], [13, 15],       # IF YOU KNOW | ANYTHING ABOUT | MICROPHONES, | ...
           [16, 17], [18, 20], [21, 23], [24, 25],                            # THE RØDE | SHOTGUN MIC HOLDER | IS SO GREAT. | IT'S PHENOMENAL.
           [26, 27], [28, 30],                                                # NOW LET'S | DO A TEST.
           [31, 34], [35, 37], [38, 39],                                      # FIRST LET ME JUST | GIVE A LITTLE | TAP HERE.
           [40, 42], [43, 44], [45, 47], [48, 51],                            # YOU CAN PROBABLY | HEAR THAT, | BUT NOW LET'S | TAKE THE MIC OFF.
           [52, 55], [56, 58], [59, 60],                                      # SO NOW I'M JUST | HAND HOLDING THE | SENNHEISER MKH416.
           [61, 64], [65, 66], [67, 68], [69, 69], [70, 72, "H.pout"]]        # TO ME IT WORKS | SO PERFECTLY | YOU CAN | LITERALLY | HOLD THE MIC.

sfx:
  - {kit: paper_slap, at: 0.02, db: -25}
  - {kit: paper_slap, at: "A2.pout+1f", db: -22}
  - {kit: printer, at: "C.in", dur: 0.34, db: -23, align: start}
  - {kit: flutter, at: "C.in+0.12", db: -26}
  - {kit: tape, at: "C.in+0.33", db: -26}
  - {kit: tick, at: "E.w:hear-0.04", db: -20}
  - {kit: sub, at: "E.w:hear-0.02", db: -17}
  - {kit: paper_slap, at: "F.w:Sennheiser", db: -24}
  - {kit: tick, at: "H.w:perfectly-0.04", db: -19}
  - {kit: lfe, at: "H.w:perfectly-0.02", db: -13}
  - {kit: swish_short, at: "H.w:literally", db: -17}
  - {kit: shutter, at: "H.pout", db: -18}
  - {kit: stamp, at: "H.pout+0.18", db: -8}
  - {kit: burn, at: "END-0.20", db: -24}
mix: {voice_chain: light, voice_lufs: -16, lufs: -14, fade_out: ["END-0.26", "END-0.10"]}
end: {burn: ["END-0.30", "END-0.20"]}
finish: medium
